<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Large Language Mind · logo export</title>
<script src="../js/neural-engine.js"></script>
<style>
  body{margin:0;background:#EDE3CC;color:#1C1712;font:18px/1.5 Georgia,serif;padding:40px;display:flex;flex-direction:column;gap:28px}
  .row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  button{font:inherit;font-size:14px;padding:6px 12px;background:none;border:1px solid #1C1712;cursor:pointer}
  .dark{background:#0A0B0D;padding:16px}
  .red{background:#A8432A;padding:16px}
</style>
</head>
<body>
<h1 style="margin:0;font-weight:400">Logo export</h1>
<p style="margin:0;max-width:60ch">Open this file in a browser (it needs <code>assets/js/neural-engine.js</code>). Each button downloads a PNG at the stated pixel size. Use these for the favicon, apple-touch-icon and social cards.</p>
<div class="row" id="row"></div>
<script>
const SPECS = [
  { name: 'logo-ink-512', size: 512, ink: '#1C1712', bg: '#EDE3CC', fill: true },
  { name: 'logo-ink-transparent-512', size: 512, ink: '#1C1712', bg: '#EDE3CC', fill: false },
  { name: 'logo-milk-on-night-512', size: 512, ink: '#E8E4DC', bg: '#0A0B0D', fill: true },
  { name: 'logo-milk-on-blood-512', size: 512, ink: '#EDE3CC', bg: '#A8432A', fill: true },
  { name: 'apple-touch-icon', size: 180, ink: '#1C1712', bg: '#EDE3CC', fill: true },
  { name: 'favicon-32', size: 32, ink: '#1C1712', bg: '#EDE3CC', fill: true },
];
const row = document.getElementById('row');
SPECS.forEach((s) => {
  const fig = document.createElement('figure');
  const c = document.createElement('canvas'); c.style.width = Math.min(160, s.size) + 'px'; c.style.height = Math.min(160, s.size) + 'px';
  const b = document.createElement('button'); b.textContent = s.name + '.png';
  fig.append(c, b); row.append(fig);
  requestAnimationFrame(() => LLMEngine.renderLogo(c, 'paper', s.bg, s.ink));
  b.onclick = () => {
    const out = document.createElement('canvas'); out.width = out.height = s.size;
    const tmp = document.createElement('canvas'); tmp.style.cssText = `position:absolute;left:-9999px;width:${s.size}px;height:${s.size}px`; document.body.append(tmp);
    LLMEngine.renderLogo(tmp, 'paper', s.bg, s.ink);
    const x = out.getContext('2d');
    if (s.fill) { x.fillStyle = s.bg; x.fillRect(0, 0, s.size, s.size); }
    x.drawImage(tmp, 0, 0, s.size, s.size); tmp.remove();
    const a = document.createElement('a'); a.download = s.name + '.png'; a.href = out.toDataURL('image/png'); a.click();
  };
});
</script>
</body>
</html>
