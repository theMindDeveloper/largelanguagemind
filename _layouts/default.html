{%- assign v = site.time | date: '%s' -%}
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {% endif %}Large Language Mind</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#EDE3CC">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/brand/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
  <meta property="og:title" content="{{ page.title | default: 'Large Language Mind' | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:image" content="{{ '/assets/brand/logo-ink-512.png' | absolute_url }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('llm-theme');
        if (t === 'night' || t === 'paper') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&family=Instrument+Serif:ital@0;1&family=Homemade+Apple&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/journal.css' | relative_url }}?v={{ v }}">
  {% if page.layout == 'note' and page.math != false %}{% include mathjax.html %}{% endif %}
</head>
<body>
{{ content }}
<script src="{{ '/assets/js/neural-engine.js' | relative_url }}?v={{ v }}"></script>
<script src="{{ '/assets/js/journal.js' | relative_url }}?v={{ v }}"></script>
</body>
</html>
